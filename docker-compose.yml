name: iotracker_nico

services:
  db:
    build:
      context: ./db
    platform: linux/amd64
    container_name: iotracker_nico_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iotracker_nico_movilidad
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iotracker_nico_movilidad"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"

  app:
    build: .
    container_name: iotracker_nico_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: iotracker_nico_movilidad
      DB_USER: postgres
      DB_PASSWORD: postgres
      SHAPEFILE_PATH: /app/data/Malla_Vial_Integral_Bogota_D_C.shp
      WEB_HOST: 0.0.0.0
      WEB_PORT: "9000"
    volumes:
      - ./data:/app/data:ro
    ports:
      - "9000:9000"

volumes:
  pgdata:
